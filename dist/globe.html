  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

</head>

<body>
  <!-- HEADER -->
  <header class="nav">
    <!-- LOGO -->
    <img src="logo.png" alt="TALK Logo" class="logo-img">

    <!-- DESKTOP NAV -->
    <nav class="nav-center">
      <a href="index.html">Home</a>

    <!-- MOBILE MENU BUTTON -->
    <button class="menu-btn" id="menuBtn">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>

  <!-- MOBILE DROPDOWN -->
  <div class="mobile-menu" id="mobileMenu">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="globe.html">Globe</a>

  </div>

  <!-- GLOBE SECTION -->
  <section class="globe-section globe-soon">
    <div class="globe-soon-inner">
      <span class="globe-soon-icon"><i class="fas fa-globe-africa"></i></span>
      <h1>Campus Globe</h1>
      <span class="globe-soon-pill">Coming soon</span>
      <p>We're mapping every campus where TALK is live. Check back soon.</p>

    <!-- When the campus list is ready, restore <div id="globe-container"></div> here
         and the globe.gl, globedata.js and globe.js script tags below. -->
  </section>

  <footer class="site-footer globe-footer">
    <div class="footer-column">
      <h3>Connect</h3>
      <div class="social-icons">
        <a href="https://x.com/TALKSUPP0101" title="X (Twitter)" aria-label="TALK on X"><i class="fab fa-twitter"></i></a>
      <a class="social-icon-app" href="https://www.talk-wide.com/profile/30b1681e-5e1f-41e0-bce6-720848f919eb" title="TALK" aria-label="Visit TALK profile"><img src="Shadowed%20Talk.svg" alt="TALK app icon"></a>
      </div>
    </div>
</footer>

  <!-- Menu Toggle Script -->
  <script>
    const menuBtn = document.getElementById('menuBtn');
    const mobileMenu = document.getElementById('mobileMenu');

    menuBtn.addEventListener('click', function () {
      menuBtn.classList.toggle('active');
      mobileMenu.classList.toggle('open');
    });

    mobileMenu.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => {
        menuBtn.classList.remove('active');
        mobileMenu.classList.remove('open');
      });
    });
  </script>
